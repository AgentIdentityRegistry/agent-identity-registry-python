[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-identity-registry"
version = "0.3.0"
description = "Python SDK + CLI for the Agent Identity Registry (AIR) — agentidentityregistry.org"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Agent Identity Registry Foundation" },
]
keywords = ["agent-identity", "did", "did-wba", "ai-agents", "trust-registry", "w3c"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
air = "agent_identity_registry.cli:main"

[project.urls]
Homepage = "https://agentidentityregistry.org"
Repository = "https://github.com/AgentIdentityRegistry/agent-identity-registry-python"
Issues = "https://github.com/AgentIdentityRegistry/agent-identity-registry-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_identity_registry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length enforced by formatter
